name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  REPOSITORY: ${{ github.repository }}
  TRIPLE: aarch64-apple-darwin
  BYLAWS_BUILD_PLUGIN_FROM_SOURCE: "1"

jobs:
  preflight:
    name: Default branch only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Refuse dispatches outside the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF" != "refs/heads/$default_branch" ]]; then
            echo "Releases must run from refs/heads/$default_branch, not $GITHUB_REF" >&2
            exit 1
          fi

  build:
    name: macOS arm64 CLI
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build only the CLI, optimized for size
        run: |
          test "$(uname -m)" = arm64
          swift --version
          swift build -c release --product bylaws --arch arm64 \
            -Xswiftc -Osize -Xlinker -dead_strip

      - name: Strip, sign, and package one arm64 executable
        run: |
          binary="$(swift build -c release --arch arm64 --show-bin-path)/bylaws"
          test -x "$binary"
          mkdir -p stage out
          install -m 755 "$binary" stage/bylaws
          strip -S -x stage/bylaws
          codesign --force --sign - --timestamp=none stage/bylaws
          codesign --verify --strict stage/bylaws
          test "$(lipo -archs stage/bylaws)" = arm64
          file stage/bylaws
          ls -lh stage/bylaws
          (cd stage && COPYFILE_DISABLE=1 zip -q -9 -X "../out/bylaws-$TRIPLE.zip" bylaws)
          test "$(unzip -Z -1 "out/bylaws-$TRIPLE.zip")" = bylaws

      - name: Smoke-test the exact ZIP payload
        run: |
          mkdir -p smoke
          unzip -q "out/bylaws-$TRIPLE.zip" -d smoke
          version="$(sed -n 's/.*current = "\([^"]*\)".*/\1/p' Sources/BylawsRunner/Project/BylawsVersion.swift)"
          test -n "$version"
          swift Scripts/test-release.swift "$PWD/smoke/bylaws" "$version"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bylaws-aarch64-apple-darwin
          path: out/bylaws-aarch64-apple-darwin.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create pre-release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bylaws-aarch64-apple-darwin
          path: dist

      - name: Verify release inventory and checksums
        run: |
          test -f "dist/bylaws-$TRIPLE.zip"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" -eq 1
          test "$(unzip -Z -1 "dist/bylaws-$TRIPLE.zip")" = bylaws
          (cd dist && sha256sum "bylaws-$TRIPLE.zip" > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Create tag at the triggering commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh api "repos/$REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/bylaws-$TRIPLE.zip" dist/SHA256SUMS \
            --repo "$REPOSITORY" \
            --prerelease \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "macOS arm64-only Bylaws CLI (no LSP), built from commit $GITHUB_SHA."
