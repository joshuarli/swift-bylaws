name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  REPOSITORY: ${{ github.repository }}
  TRIPLE: aarch64-apple-darwin
  BYLAWS_BUILD_PLUGIN_FROM_SOURCE: "1"

jobs:
  preflight:
    name: Default branch only
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse dispatches outside the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$GITHUB_REF_TYPE" != "branch" || "$GITHUB_REF" != "refs/heads/$default_branch" ]]; then
            echo "Releases must run from refs/heads/$default_branch, not $GITHUB_REF" >&2
            exit 1
          fi

  build:
    name: macOS arm64 CLI
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build only the CLI, optimized for runtime performance
        run: |
          test "$(uname -m)" = arm64
          swift --version
          # Release already enables -O and whole-module optimization.
          # Add cross-module optimization, full LTO and Apple M1 code generation.
          # Do not use -Ounchecked: preserve Swift's runtime safety checks.
          swift build -c release --product bylaws --arch arm64 \
            --experimental-lto-mode full \
            -Xswiftc -cross-module-optimization \
            -Xswiftc -target-cpu -Xswiftc apple-m1 \
            -Xcc -mcpu=apple-m1

      - name: Strip, sign, and package one arm64 executable
        run: |
          binary="$(swift build -c release --arch arm64 --show-bin-path)/bylaws"
          test -x "$binary"
          mkdir -p stage out
          install -m 755 "$binary" stage/bylaws
          strip -S -x stage/bylaws
          codesign --force --sign - --timestamp=none stage/bylaws
          codesign --verify --strict stage/bylaws
          test "$(lipo -archs stage/bylaws)" = arm64
          file stage/bylaws
          ls -lh stage/bylaws
          COPYFILE_DISABLE=1 tar -cJf "out/bylaws-$TRIPLE.tar.xz" -C stage bylaws
          test "$(tar -tJf "out/bylaws-$TRIPLE.tar.xz")" = bylaws

      - name: Smoke-test the exact archive payload
        run: |
          mkdir -p smoke
          tar -xJf "out/bylaws-$TRIPLE.tar.xz" -C smoke
          VERSION_FILE="Sources/BylawsRunner/Project/BylawsVersion.swift"
          version="$(sed -n 's/.*current = "\([^"]*\)".*//p' "$VERSION_FILE")"
          test -n "$version"
          swift Scripts/test-release.swift "$PWD/smoke/bylaws" "$version"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bylaws-aarch64-apple-darwin
          path: out/bylaws-aarch64-apple-darwin.tar.xz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create pre-release
    needs: [preflight, build]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bylaws-aarch64-apple-darwin
          path: dist

      - name: Verify release inventory and checksums
        run: |
          test -f "dist/bylaws-$TRIPLE.tar.xz"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" -eq 1
          test "$(tar -tJf "dist/bylaws-$TRIPLE.tar.xz")" = bylaws
          (cd dist && sha256sum "bylaws-$TRIPLE.tar.xz" > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Create tag at the triggering commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh api "repos/$REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$previous" ]]; then
            printf 'Initial release at %s.\n' "$GITHUB_SHA" > "$notes"
            exit 0
          fi
          compare="repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA"
          status=$(gh api "$compare" --jq '.status')
          if [[ "$status" != ahead ]]; then
            printf 'Release notes rejected: %s is %s relative to %s, expected ahead\n' "$GITHUB_SHA" "$status" "$previous" >&2
            exit 1
          fi
          {
            printf '## Changes since %s\n\n' "$previous"
            gh api --paginate "$compare?per_page=100" --jq '.commits[] | "- \(.sha[0:12]) \(.commit.message | split("\n")[0])"'
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_SHA"
          } > "$notes"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/bylaws-$TRIPLE.tar.xz" dist/SHA256SUMS \
            --repo "$REPOSITORY" \
            --prerelease \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
